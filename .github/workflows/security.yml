name: Security

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions: {}

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  CI: "true"
  HOST: 127.0.0.1
  NEXT_PUBLIC_ADMIN_URL: http://localhost:3001
  NEXT_PUBLIC_STOREFRONT_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: "1"
  PORT: "4000"

jobs:
  dependency_review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  dependency_audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  licenses:
    name: License policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Enforce production dependency license policy
        run: node scripts/check-licenses.mjs

  trivy_filesystem:
    name: Trivy filesystem
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan source, configuration, and lockfile
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: "true"
          exit-code: "1"
          format: table
          ignore-unfixed: "true"
          scan-ref: .
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml

  source_sbom:
    name: Source SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate source software bill of materials
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          artifact-name: threadsofgold-source.spdx.json
          format: spdx-json
          output-file: threadsofgold-source.spdx.json
          path: .
          upload-artifact: "true"
          upload-release-assets: "false"

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          build-mode: none
          languages: javascript-typescript

      - name: Analyze source
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:javascript-typescript

  image_security:
    name: Image / ${{ matrix.application }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        application:
          - storefront
          - admin
          - api
          - worker
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build application image
        id: build_image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-args: |
            APP_RELEASE=${{ github.sha }}
          context: .
          load: true
          provenance: false
          push: false
          sbom: false
          tags: threadsofgold-${{ matrix.application }}:ci
          target: ${{ matrix.application }}

      - name: Scan application image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: "true"
          exit-code: "1"
          format: table
          ignore-unfixed: "true"
          image-ref: threadsofgold-${{ matrix.application }}:ci
          scan-type: image
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml

      - name: Generate image software bill of materials
        if: ${{ !cancelled() && steps.build_image.outcome == 'success' }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          artifact-name: threadsofgold-${{ matrix.application }}.spdx.json
          format: spdx-json
          image: threadsofgold-${{ matrix.application }}:ci
          output-file: threadsofgold-${{ matrix.application }}.spdx.json
          upload-artifact: "true"
          upload-release-assets: "false"
