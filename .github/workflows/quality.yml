name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  CI: "true"
  DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
  HOST: 127.0.0.1
  NEXT_PUBLIC_ADMIN_URL: http://localhost:3001
  NEXT_PUBLIC_STOREFRONT_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: "1"
  PORT: "4000"

jobs:
  static_analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Validate dependency update policy
        run: pnpm renovate:validate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

  unit_tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Run unit tests with coverage
        run: pnpm test:unit

  integration_tests:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Run integration tests
        env:
          TOG_RUN_TESTCONTAINERS: "1"
        run: pnpm test:integration

  contract_tests:
    name: Contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify generated API contracts
        run: pnpm contracts:check

      - name: Run contract tests
        run: pnpm test:contract

  application_builds:
    name: Build / ${{ matrix.application }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        application:
          - storefront
          - admin
          - api
          - worker
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Build application and workspace dependencies
        run: |
          pnpm database:generate
          pnpm exec turbo run build --filter="@threadsofgold/${{ matrix.application }}..."

  e2e_tests:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e

  terraform:
    name: Terraform validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Validate environment isolation contract
        run: node scripts/validate-environment-topology.mjs

      - name: Discover and validate Terraform roots
        run: node .github/scripts/validate-terraform.mjs

  security:
    name: Security foundation
    uses: ./.github/workflows/security.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write

  quality:
    name: Quality
    if: ${{ always() }}
    needs:
      - static_analysis
      - unit_tests
      - integration_tests
      - contract_tests
      - application_builds
      - e2e_tests
      - terraform
      - security
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every quality capability
        env:
          APPLICATION_BUILDS_RESULT: ${{ needs.application_builds.result }}
          CONTRACT_TESTS_RESULT: ${{ needs.contract_tests.result }}
          E2E_TESTS_RESULT: ${{ needs.e2e_tests.result }}
          INTEGRATION_TESTS_RESULT: ${{ needs.integration_tests.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          STATIC_ANALYSIS_RESULT: ${{ needs.static_analysis.result }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit_tests.result }}
        run: |
          for result in \
            "$STATIC_ANALYSIS_RESULT" \
            "$UNIT_TESTS_RESULT" \
            "$INTEGRATION_TESTS_RESULT" \
            "$CONTRACT_TESTS_RESULT" \
            "$APPLICATION_BUILDS_RESULT" \
            "$E2E_TESTS_RESULT" \
            "$TERRAFORM_RESULT" \
            "$SECURITY_RESULT"
          do
            if [ "$result" != "success" ]; then
              echo "A required quality capability finished with status: $result" >&2
              exit 1
            fi
          done
